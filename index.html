<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Ulangan Kelas 1 SD</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F6FDE">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#EAF4FF;--paper:#fff;--ink:#1F2A5C;--mute:#5B6690;--line:#C9DDF5;--mtk:#2F6FDE;--ind:#E8503A;--pan:#1E9E6A;--ok:#1E9E6A;--okbg:#DDF6E9;--no:#C2570C;--nobg:#FFE9D6;--star:#FFB800;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A33;--paper:#1B2547;--ink:#F1F4FF;--mute:#A9B4DD;--line:#2E3B6B;--mtk:#6FA2FF;--ind:#FF8A76;--pan:#4BD39A;--ok:#4BD39A;--okbg:#17382F;--no:#FFB27A;--nobg:#4A2F1D;--star:#FFC93C}}
:root[data-theme="dark"]{--bg:#121A33;--paper:#1B2547;--ink:#F1F4FF;--mute:#A9B4DD;--line:#2E3B6B;--mtk:#6FA2FF;--ind:#FF8A76;--pan:#4BD39A;--ok:#4BD39A;--okbg:#17382F;--no:#FFB27A;--nobg:#4A2F1D;--star:#FFC93C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:20px;line-height:1.3;min-height:100vh;
background-image:repeating-linear-gradient(transparent 0 35px,color-mix(in srgb,var(--line) 55%,transparent) 35px 36px)}
#app{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:40px;line-height:1.05;margin:8px 0 4px;font-weight:800}
h1 span{display:block;font-size:26px;color:var(--mute);font-weight:700}
h2{font-size:28px;margin:8px 0 10px;font-weight:700;line-height:1.2}
.sub{margin:0 0 18px;color:var(--mute)}
.grid{display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--mtk);outline-offset:3px}
.card{display:grid;grid-template-columns:64px 1fr;align-items:center;column-gap:14px;text-align:left;background:var(--paper);border:3px solid var(--c);border-bottom-width:8px;border-radius:20px;padding:12px 16px}
.card:active{transform:translateY(3px);border-bottom-width:5px}
.card .ik{grid-row:span 2;font-size:48px;text-align:center}
.card b{font-size:26px;color:var(--c);line-height:1.1}
.card small{font-size:16px;color:var(--mute)}
.ortu{display:flex;gap:12px;align-items:center;margin-top:22px;background:var(--paper);border:3px dashed var(--line);border-radius:16px;padding:12px 14px}
.ortu input{width:28px;height:28px;flex:none}
.ortu small{font-size:15px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-weight:700;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:2px solid var(--line);border-radius:999px;padding:6px 18px;min-height:48px;font-size:18px;color:var(--mute);background:var(--paper)}
.bar{height:14px;background:var(--paper);border:2px solid var(--line);border-radius:99px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.vis{font-size:56px;text-align:center;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:14px 8px;margin-bottom:10px;word-break:break-word;line-height:1.15}
.opts{display:grid;gap:12px;margin:14px 0}
.opt{background:var(--paper);border:3px solid var(--c);border-bottom-width:7px;border-radius:18px;padding:12px 16px;font-size:26px;font-weight:700;text-align:left;min-height:68px;display:flex;align-items:center;gap:12px}
.opt:active{transform:translateY(3px)}
.opt:disabled{cursor:default;transform:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt.dim{opacity:.55}
.opt.ok .lt{background:var(--ok)}.opt.no .lt{background:var(--no)}
.opt.ok::after,.opt.no::after{margin-left:auto;font-size:32px;line-height:1}
.opt.ok::after{content:"✓";color:var(--ok)}.opt.no::after{content:"✗";color:var(--no)}
.fb{border-radius:16px;padding:12px 16px;font-size:22px;font-weight:700;margin-bottom:10px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--nobg);color:var(--no)}
.note{font-size:18px;font-weight:500;color:var(--ink);background:var(--paper);border:3px dashed var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.go{display:block;width:100%;background:var(--c);color:#fff;border:0;border-bottom:7px solid rgba(0,0,0,.28);border-radius:18px;padding:12px;font-size:26px;font-weight:800;margin-top:8px}
.go.alt{background:var(--paper);color:var(--ink);border:3px solid var(--line);border-bottom-width:7px}
.stars{font-size:64px;text-align:center;letter-spacing:6px;color:var(--star);margin:6px 0}
.stars .off{color:var(--line)}
.skor{text-align:center;font-size:34px;font-weight:800}
.msg{text-align:center;color:var(--mute);margin:0 0 16px}
.rev{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;font-size:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app>*{animation:in .22s ease-out}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.no{background:var(--no);border-color:var(--no)}
.dots i.cur{border-color:var(--c);box-shadow:0 0 0 3px var(--star)}
.top span.nv{display:flex;gap:8px}
.dots i.sk{border-style:dashed;border-color:var(--star)}
.form{display:flex;gap:10px;align-items:center;margin-top:18px;background:var(--paper);border:3px dashed var(--line);border-radius:16px;padding:10px 12px}
.inp{flex:1;min-width:0;font:inherit;font-size:22px;padding:8px 12px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:8px 0 2px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:16px;color:var(--mute)}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:4px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.bd{background:var(--paper);border:3px solid var(--star);border-radius:16px;padding:8px 10px;font-size:17px;text-align:center;line-height:1.15}
.bd span{display:block;font-size:34px}
.bd.off{opacity:.4;filter:grayscale(1);border-color:var(--line)}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}}
.tm{font-weight:800;color:var(--ind)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.seg button{font:inherit;font-size:18px;padding:6px 16px;min-height:48px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
summary{font-weight:700;cursor:pointer}
details div{font-size:17px;margin:4px 0}
.lt{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--paper);font-size:22px;font-weight:800;line-height:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go:not(.alt){color:#0E1530}}
:root[data-theme="dark"] .go:not(.alt){color:#0E1530}
#fb:not(:empty){position:sticky;bottom:0;z-index:2;background:var(--bg);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:6px;box-shadow:0 -14px 14px -4px var(--bg)}
body{min-height:100dvh}
@media (min-width:720px){
#app{max-width:880px;padding:36px 28px 56px}
body{font-size:24px}
h1{font-size:54px}h1 span{font-size:32px}h2{font-size:34px}
.grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.card{grid-template-columns:1fr;justify-items:center;text-align:center;row-gap:6px;padding:22px 16px}
.card .ik{grid-row:auto;font-size:72px;line-height:1}
.card b{font-size:30px}.card small{font-size:19px}
.vis{font-size:80px;padding:22px}
.opts{grid-template-columns:1fr 1fr;gap:16px}
.opt{font-size:32px;min-height:92px;padding:16px 20px}.lt{width:48px;height:48px;font-size:28px}
.fb{font-size:26px}.note{font-size:21px}
.go{font-size:30px;padding:16px;max-width:640px;margin-left:auto;margin-right:auto}
.ghost,.seg button{min-height:56px;font-size:21px}
.inp{font-size:26px}
.stars{font-size:88px}.bars{height:130px}.bars div{font-size:18px}
.badges{grid-template-columns:repeat(3,1fr)}.bd{font-size:20px}
.dots i{width:20px;height:20px}
.rev{font-size:21px}
}
</style>
</head>

function simpanDB(){try{localStorage.setItem("ulangan_db",JSON.stringify(DB))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function prof(){return DB.p[DB.aktif]}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function bintang(s){return s>=8?3:s>=5?2:1}
function bintangHtml(n){return "★".repeat(n)+'<span class="off">'+"★".repeat(3-n)+"</span>"}
function baca(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=DB.cfg.rate;speechSynthesis.speak(u)}catch(e){}}
function sk(r){return Math.round(r.s/r.n*10)}
function hist(k){return prof().h.filter(function(r){return r.k===k})}
function best(k){return hist(k).reduce(function(m,r){return Math.max(m,sk(r))},0)}
function rata(k){var h=hist(k);return h.length?h.reduce(function(a,r){return a+sk(r)},0)/h.length:0}
function nUlang(){var w=prof().w,c=0;for(var id in w)if(w[id]>0)c++;return c}
function lencana(){var h=prof().h,ks={};h.forEach(function(r){if(r.k!=="ulang")ks[r.k]=1});
  return [
    {i:"🌱",n:"Latihan pertama",ok:h.length>=1},
    {i:"⭐",n:"Nilai sempurna",ok:h.some(function(r){return r.n>=5&&r.s===r.n})},
    {i:"🔥",n:"Rajin: 5 latihan",ok:h.length>=5},
    {i:"🎓",n:"Coba 3 pelajaran",ok:Object.keys(ks).length>=3},
    {i:"💪",n:"Ulang soal sulit",ok:h.some(function(r){return r.k==="ulang"})}
  ]}

    (u?'<button class="go" id="ul" style="--c:var(--ind)">💪 Latihan ulang soal sulit ('+u+')</button>':'')+
    '<button class="go alt" id="pg">📈 Lihat progres</button>'+
    
    '<button class="ghost" id="gt" style="margin-top:14px">Ganti anak</button> <button class="ghost" id="od" style="margin-top:14px">🔒 Pendamping</button>';
  $.querySelectorAll(".card").forEach(function(b){b.onclick=function(){bab(b.dataset.k)}});
  if(u)document.getElementById("ul").onclick=mulaiUlang;
  document.getElementById("pg").onclick=progres;
  document.getElementById("gt").onclick=anak;
  document.getElementById("od").onclick=bukaOrtu;
  var oc=document.getElementById("ortu");if(oc)oc.onchange=function(e){S.ortu=e.target.checked};
}

function buat(k){var d=D[k],out=[];
  d.q.forEach(function(x,i){out.push({k:k,id:k+":"+i,bab:d.m[i],y:"pg",v:x[0],t:x[1],b:x[2][0],o:sh(x[2]),e:x[3]})});
  d.x.forEach(function(x,j){out.push({k:k,id:k+":x"+j,bab:x.b,y:"pg",v:x.v,t:x.t,b:x.o[0],o:sh(x.o),e:x.e})});
  return out}
function reset(){S.i=0;S.skor=0;S.salah=[];S.hs=[];S.skp={};S.pilih=null;S.done=0;S.timeout=0;mulaiTimer()}
function mulai(k,b){
  S.k=k;S.ulang=false;S.bab=b;var all=sh(buat(k));
  S.qs=(b>=0?all.filter(function(q){return q.bab===b}):all).slice(0,N());reset();tanya();
}
function mulaiUlang(){
  var w=prof().w,all=[];Object.keys(D).forEach(function(k){all=all.concat(buat(k))});
  all=all.filter(function(q){return w[q.id]>0}).sort(function(a,b){return w[b.id]-w[a.id]});
  if(!all.length)return;
  S.k="ulang";S.ulang=true;S.bab=-1;S.qs=sh(all.slice(0,N()));reset();tanya();
}
function bab(k){
  S.k=k;var d=D[k],all=buat(k);
  $.innerHTML='<div style="--c:'+d.c+'"><div class="top"><button class="ghost" id="x">Menu</button></div><h1>'+d.i+' '+d.n+'<span>Pilih bab latihan</span></h1><div class="grid">'+
    d.bab.map(function(n,i){var c=all.filter(function(q){return q.bab===i}).length;
      return '<button class="card" style="--c:'+d.c+'" data-b="'+i+'"><span class="ik">'+(i+1)+'</span><b>'+n+'</b><small>'+c+' soal</small></button>'}).join("")+
    '<button class="card" style="--c:var(--star)" data-b="-1"><span class="ik">🎲</span><b>Campuran</b><small>'+(DB.cfg.n>0?DB.cfg.n:"semua")+' soal acak dari semua bab</small></button></div></div>';
  document.getElementById("x").onclick=home;
  $.querySelectorAll(".card").forEach(function(b){b.onclick=function(){mulai(k,+b.dataset.b)}});
}
function tanya(){
  var q=S.qs[S.i],n=S.qs.length,c=D[q.k].c;S.done=0;
  $.innerHTML='<div style="--c:'+c+'"><div class="top"><span class="nv"><button class="ghost" id="x">🏠 Menu</button>'+(S.ulang?"":'<button class="ghost" id="bb">📚 Bab</button>')+'</span><span>'+(S.ulang?"Latihan ulang: ":"")+'Soal '+(S.i+1)+' dari '+n+(S.skp[q.id]?' · dilewati tadi':'')+'</span>'+(S.sisa>0?'<span id="tm" class="tm">⏱ '+fmt(S.sisa)+'</span>':'')+'</div><div id="kl" aria-live="polite"></div>'+
    (n<=20?'<div class="dots" aria-hidden="true">'+S.qs.map(function(z,i){return '<i class="'+(S.hs[i]===1?"ok":S.hs[i]===0?"no":"")+(i===S.i?" cur":"")+(S.hs[i]===undefined&&S.skp[z.id]?" sk":"")+'"></i>'}).join("")+'</div>':'<div class="bar"><i style="width:'+(S.i/n*100)+'%;background:'+c+'"></i></div>')+
    (q.v?'<div class="vis" aria-hidden="true">'+q.v+'</div>':'')+'<h2>'+q.t+'</h2>'+
    '<button class="ghost" id="say">🔊 Bacakan soal</button>'+(S.i<n-1?' <button class="ghost" id="lw">⏭ Lewati dulu</button>':'')+'<div id="area"></div><div id="fb" aria-live="polite"></div></div>';
  function pergi(fn){
    if(S.i===0&&!S.done){fn();return}
    var k=document.getElementById("kl");
    k.innerHTML='<div class="fb no">Keluar dari latihan? Hasil belum disimpan.<br><button class="ghost" id="ky">Keluar</button> <button class="ghost" id="kn">Lanjut latihan</button></div>';
    document.getElementById("ky").onclick=fn;document.getElementById("kn").onclick=function(){k.innerHTML=""};
  }
  document.getElementById("x").onclick=function(){pergi(home)};
  var bb=document.getElementById("bb");if(bb)bb.onclick=function(){pergi(function(){bab(S.k)})};
  var lw=document.getElementById("lw");
  if(lw)lw.onclick=function(){if(S.done)return;try{speechSynthesis.cancel()}catch(e){}S.skp[q.id]=1;S.qs.push(S.qs.splice(S.i,1)[0]);tanya()};
  document.getElementById("say").onclick=function(){baca(q.t+(q.o?". Pilihannya: "+pil(q):""))};
  var area=document.getElementById("area");
  if(DB.cfg.auto)baca(q.t+(q.o?". Pilihannya: "+pil(q):""));
  if(q.o){
    area.innerHTML='<div class="opts">'+q.o.map(function(o,i){return '<button class="opt" data-i="'+i+'"><span class="lt">'+"abcd".charAt(i)+'</span><span>'+o+'</span></button>'}).join("")+'</div>';
    area.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
      if(S.done)return;S.done=1;var i=+b.dataset.i;
      area.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true;
        if(q.o[j]===q.b)x.classList.add("ok");else if(j===i)x.classList.add("no");else x.classList.add("dim")});
      nilai(q.o[i]===q.b)}});

  }
}
function nilai(ok){
  var q=S.qs[S.i],w=prof().w;S.hs[S.i]=ok?1:0;
  var lw=document.getElementById("lw");if(lw)lw.style.display="none";
  var dt=document.querySelectorAll(".dots i")[S.i];if(dt)dt.className=(ok?"ok":"no")+" cur";
  if(ok){S.skor++;if(w[q.id]>0)w[q.id]--}else{S.salah.push(q);w[q.id]=(w[q.id]||0)+1}
  simpanDB();
  var last=S.i===S.qs.length-1;
  document.getElementById("fb").innerHTML=
    '<div class="fb '+(ok?"ok":"no")+'">'+(ok?"🎉 Hebat! Jawabanmu benar.":"💪 Hampir! Jawaban yang benar: "+(q.o?"abcd".charAt(q.o.indexOf(q.b))+". ":"")+q.b)+'</div>'+
    (S.ortu?'<div class="note">👨‍👩‍👧 Catatan pendamping: '+q.e+'</div>':"")+
    '<button class="go" id="next">'+(last?"Lihat hasil":"Lanjut")+'</button>';
  var nx=document.getElementById("next");nx.focus();
  nx.onclick=function(){if(last)hasil();else{S.i++;tanya()}};
}

function fmt(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function N(){return DB.cfg.n>0?DB.cfg.n:99}
function mulaiTimer(){
  clearInterval(S.iv);S.sisa=DB.cfg.dur*60;if(!S.sisa)return;
  S.iv=setInterval(function(){var el=document.getElementById("tm");if(!el){clearInterval(S.iv);return}
    S.sisa--;el.textContent="⏱ "+fmt(Math.max(S.sisa,0));if(S.sisa<=0){clearInterval(S.iv);habis()}},1000);
}
function habis(){S.qs=S.qs.slice(0,S.i+(S.done?1:0));if(!S.qs.length){home();return}S.timeout=1;hasil()}
function seg(l,key,opts){return '<b>'+l+'</b><div class="seg">'+opts.map(function(o){return '<button data-k="'+key+'" data-v="'+o[0]+'" class="'+(DB.cfg[key]===o[0]?"on":"")+'">'+o[1]+'</button>'}).join("")+'</div>'}
function bukaOrtu(){DB.cfg.pin?pinScreen():ortuScreen()}
function pinScreen(){
  $.innerHTML='<h1>Layar pendamping<span>Masukkan PIN</span></h1><div class="form"><input class="inp" id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"><button class="ghost" id="ok">Buka</button></div><p class="msg" id="pm"></p><button class="go alt" id="back">Kembali</button>';
  var pin=document.getElementById("pin");
  function cek(){if(pin.value===DB.cfg.pin)ortuScreen();else{pin.value="";document.getElementById("pm").textContent="PIN salah. Lupa PIN? Lihat README."}}
  document.getElementById("ok").onclick=cek;pin.onkeydown=function(e){if(e.key==="Enter")cek()};
  document.getElementById("back").onclick=home;
}
function ortuScreen(){
  var y=window.scrollY,w=prof().w,all=[];Object.keys(D).forEach(function(k){all=all.concat(buat(k))});
  var lemah=all.filter(function(q){return w[q.id]>0}).sort(function(a,b){return w[b.id]-w[a.id]}).slice(0,5);
  var s=function(q){return (q.v?q.v+" ":"")+q.t};
  $.innerHTML='<h1>Pendamping<span>'+esc(DB.aktif)+'</span></h1><h2>Pengaturan latihan</h2>'+
    seg("Jumlah soal","n",[[5,"5"],[10,"10"],[0,"Semua"]])+seg("Batas waktu","dur",[[0,"Tanpa"],[5,"5 menit"],[10,"10 menit"]])+
    seg("Kecepatan suara","rate",[[.7,"Sangat pelan"],[.85,"Pelan"],[1,"Normal"]])+seg("Baca soal otomatis","auto",[[false,"Mati"],[true,"Hidup"]])+seg("Catatan pendamping saat latihan","ortu",[[false,"Mati"],[true,"Hidup"]])+
    '<h2>Perlu didampingi</h2>'+(lemah.length?lemah.map(function(q){return '<div class="rev"><b>'+s(q)+'</b> <small>('+D[q.k].n+', salah '+w[q.id]+'x)</small><br>Jawaban: '+q.b+'<br>'+q.e+'</div>'}).join(""):'<p class="msg">Belum ada soal yang sering salah.</p>')+
    '<h2>Kunci jawaban</h2>'+Object.keys(D).map(function(k){return '<details class="rev"><summary>'+D[k].i+' '+D[k].n+'</summary>'+D[k].bab.map(function(n,i){return '<p><b>'+n+'</b></p>'+all.filter(function(q){return q.k===k&&q.bab===i}).map(function(q){return '<div>• '+s(q)+' <b>'+q.b+'</b></div>'}).join("")}).join("")+'</details>'}).join("")+
    (DB.cfg.pin?'<h2>PIN pendamping</h2><p class="msg">PIN aktif.</p><button class="go alt" id="delpin">Hapus PIN</button>':'<h2>PIN pendamping</h2><p class="sub" style="font-size:17px">Kunci layar ini agar anak tidak melihat kunci jawaban.</p><div class="form"><input class="inp" id="npin" inputmode="numeric" maxlength="4" placeholder="4 angka" aria-label="PIN baru"><button class="ghost" id="setpin">Pasang PIN</button></div>')+'<h2>Cadangan data</h2><p class="sub" style="font-size:17px">Simpan data semua anak ke berkas, atau pulihkan di perangkat lain.</p><button class="go alt" id="ekspor">⬇️ Simpan cadangan</button><label class="go alt" style="text-align:center;cursor:pointer">⬆️ Pulihkan cadangan<input type="file" id="impor" accept=".json,application/json" hidden></label><p class="msg" id="bm"></p><button class="go" id="back" style="--c:var(--mtk)">Kembali</button>';
  var sp=document.getElementById("setpin");if(sp)sp.onclick=function(){var v=document.getElementById("npin").value.trim();if(/^\d{4}$/.test(v)){DB.cfg.pin=v;simpanDB();ortuScreen()}else document.getElementById("bm").textContent="PIN harus 4 angka."};
  var dp=document.getElementById("delpin");if(dp)dp.onclick=function(){DB.cfg.pin="";simpanDB();ortuScreen()};
  document.getElementById("ekspor").onclick=function(){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));a.download="cadangan-latihan-ulangan.json";a.click()}catch(e){document.getElementById("bm").textContent="Tidak bisa menyimpan di sini. Buka aplikasi di browser."}};
  document.getElementById("impor").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x||!x.p)throw 0;Object.keys(x.p).forEach(function(n){var d=x.p[n];if(!DB.p[n])DB.p[n]=d;else{d.h.forEach(function(h){if(!DB.p[n].h.some(function(o){return o.t===h.t}))DB.p[n].h.push(h)});DB.p[n].h.sort(function(a,b){return a.t-b.t});for(var id in d.w)DB.p[n].w[id]=Math.max(DB.p[n].w[id]||0,d.w[id])}});if(!DB.aktif)DB.aktif=x.aktif;simpanDB();document.getElementById("bm").textContent="Cadangan berhasil dipulihkan."}catch(er){document.getElementById("bm").textContent="Berkas cadangan tidak valid."}};r.readAsText(f)};
  $.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){var v=b.dataset.v;DB.cfg[b.dataset.k]=v==="true"?true:v==="false"?false:+v;simpanDB();ortuScreen();window.scrollTo(0,y)}});
  document.getElementById("back").onclick=home;
}
function hasil(){
  var p=prof(),n=S.qs.length,s=S.skor,sebelum=lencana().filter(function(b){return b.ok}).length;
  p.h.push({k:S.k,b:S.bab,s:s,n:n,t:Date.now()});if(p.h.length>60)p.h=p.h.slice(-60);simpanDB();
  var baru=lencana().filter(function(b){return b.ok}).slice(sebelum);
  var nama=S.ulang?"Latihan Ulang":D[S.k].n,st=bintang(s/n*10);
  var pesan=s/n>=.8?"Luar biasa! Kamu pintar sekali.":s/n>=.5?"Bagus! Sedikit lagi sempurna.":"Tidak apa-apa. Ayo latihan lagi pelan-pelan.";
  var rev=S.ortu&&S.salah.length?'<h2>Yang perlu diulang</h2>'+S.salah.map(function(q){return '<div class="rev"><b>'+q.t+'</b><br>Jawaban benar: '+(q.o?"abcd".charAt(q.o.indexOf(q.b))+". ":"")+q.b+'<br>'+q.e+'</div>'}).join(""):"";
  $.innerHTML='<div style="--c:'+(S.ulang?"var(--ind)":D[S.k].c)+'"><h2 style="text-align:center">'+nama+'</h2><div class="stars" aria-label="'+st+' bintang">'+bintangHtml(st)+'</div>'+
    '<div class="skor">'+s+' dari '+n+' benar</div><p class="msg">'+(S.timeout?"⏰ Waktu habis. ":"")+pesan+'</p>'+
    (baru.length?'<div class="fb ok">🏅 Lencana baru: '+baru.map(function(b){return b.i+" "+b.n}).join(", ")+'</div>':"")+rev+
    (S.salah.length?'<button class="go" id="ul">💪 Latih soal yang salah</button>':"")+
    '<button class="go alt" id="ulang">'+(S.ulang?"Menu":"Ulangi latihan")+'</button><button class="go alt" id="pg">📈 Lihat progres</button>'+(S.ulang?"":'<button class="go alt" id="bp">📚 Pilih bab lain</button><button class="go alt" id="mn">🏠 Menu</button>')+'</div>';
  if(S.salah.length)document.getElementById("ul").onclick=mulaiUlang;
  document.getElementById("ulang").onclick=function(){S.ulang?home():mulai(S.k,S.bab)};
  document.getElementById("pg").onclick=progres;
  var bp=document.getElementById("bp");if(bp){var sk0=S.k;bp.onclick=function(){bab(sk0)};document.getElementById("mn").onclick=home}
}

function perBab(k){var d=D[k],n=d.bab.length;return d.bab.concat(["Campuran"]).map(function(nm,i){var h=hist(k).filter(function(r){return r.b===(i<n?i:-1)});if(!h.length)return "";var m=h.reduce(function(a,r){return a+sk(r)},0)/h.length;return '<div style="font-size:16px">• '+nm+': rata-rata '+m.toFixed(1)+'/10 ('+h.length+'x)</div>'}).join("")}
function progres(){
  var p=prof(),tgl=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  var kel=Object.keys(D).map(function(k){var h=hist(k);
    return '<div class="rev"><b style="color:'+D[k].c+'">'+D[k].i+' '+D[k].n+'</b><br>'+(h.length?'Terbaik '+best(k)+'/10, rata-rata '+rata(k).toFixed(1)+', '+h.length+' latihan'+
      '<div class="bars">'+h.slice(-8).map(function(r){return '<div><span>'+sk(r)+'</span><i style="height:'+(r.s/r.n*100)+'%;background:'+D[k].c+'"></i></div>'}).join("")+'</div>'+perBab(k):'Belum dicoba')+'</div>'}).join("");
  var tr=Object.keys(D).filter(function(k){return hist(k).length}).sort(function(a,b){return rata(a)-rata(b)}),u=nUlang();
  var saran=!tr.length?"Mulai latihan dulu untuk melihat saran.":rata(tr[0])>=9&&!u?"Hebat! Semua pelajaran sudah bagus.":"Perlu latihan lagi: <b>"+D[tr[0]].n+"</b>"+(u?". Ada "+u+" soal yang masih sering salah.":".");
  $.innerHTML='<h1>Progres<span>'+esc(DB.aktif)+'</span></h1><p class="sub">Dicetak '+tgl+'</p>'+
    '<div class="fb ok" style="background:var(--paper);color:var(--ink)">'+saran+'</div>'+kel+
    '<h2>Lencana</h2><div class="badges">'+lencana().map(function(b){return '<div class="bd'+(b.ok?"":" off")+'"><span>'+b.i+'</span>'+b.n+'</div>'}).join("")+'</div>'+
    '<button class="go alt noprint" id="cetak">🖨️ Cetak hasil (PDF)</button><p class="msg noprint" id="cm"></p><button class="go noprint" id="back" style="--c:var(--mtk)">Kembali</button>';
  document.getElementById("cetak").onclick=function(){try{window.print()}catch(e){document.getElementById("cm").textContent="Cetak tidak tersedia di sini. Buka berkas ini di browser, lalu cetak."}};
  document.getElementById("back").onclick=home;
}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
document.addEventListener("keydown",function(e){if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key.toLowerCase()==="s"){var l=document.getElementById("lw");if(l&&l.style.display!=="none")l.click();return}var m={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3}[e.key.toLowerCase()];if(m===undefined)return;var b=document.querySelector('.opt[data-i="'+m+'"]');if(b&&!b.disabled)b.click()});
home();
</script>
</body>
</html>
