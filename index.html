<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Ulangan Kelas 1 SD</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F6FDE">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#EAF4FF;--paper:#fff;--ink:#1F2A5C;--mute:#5B6690;--line:#C9DDF5;--mtk:#2F6FDE;--ind:#E8503A;--pan:#1E9E6A;--ok:#1E9E6A;--okbg:#DDF6E9;--no:#C2570C;--nobg:#FFE9D6;--star:#FFB800;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A33;--paper:#1B2547;--ink:#F1F4FF;--mute:#A9B4DD;--line:#2E3B6B;--mtk:#6FA2FF;--ind:#FF8A76;--pan:#4BD39A;--ok:#4BD39A;--okbg:#17382F;--no:#FFB27A;--nobg:#4A2F1D;--star:#FFC93C}}
:root[data-theme="dark"]{--bg:#121A33;--paper:#1B2547;--ink:#F1F4FF;--mute:#A9B4DD;--line:#2E3B6B;--mtk:#6FA2FF;--ind:#FF8A76;--pan:#4BD39A;--ok:#4BD39A;--okbg:#17382F;--no:#FFB27A;--nobg:#4A2F1D;--star:#FFC93C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2 Lokal","Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:20px;line-height:1.3;min-height:100vh;
background-image:repeating-linear-gradient(transparent 0 35px,color-mix(in srgb,var(--line) 55%,transparent) 35px 36px)}
#app{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:40px;line-height:1.05;margin:8px 0 4px;font-weight:800}
h1 span{display:block;font-size:26px;color:var(--mute);font-weight:700}
h2{font-size:28px;margin:8px 0 10px;font-weight:700;line-height:1.2}
.sub{margin:0 0 18px;color:var(--mute)}
.grid{display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--mtk);outline-offset:3px}
.card{display:grid;grid-template-columns:64px 1fr;align-items:center;column-gap:14px;text-align:left;background:var(--paper);border:3px solid var(--c);border-bottom-width:8px;border-radius:20px;padding:12px 16px}
.card:active{transform:translateY(3px);border-bottom-width:5px}
.card .ik{grid-row:span 2;font-size:48px;text-align:center}
.card b{font-size:26px;color:var(--c);line-height:1.1}
.card small{font-size:16px;color:var(--mute)}
.ortu{display:flex;gap:12px;align-items:center;margin-top:22px;background:var(--paper);border:3px dashed var(--line);border-radius:16px;padding:12px 14px}
.ortu input{width:28px;height:28px;flex:none}
.ortu small{font-size:15px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-weight:700;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:2px solid var(--line);border-radius:999px;padding:6px 18px;min-height:48px;font-size:18px;color:var(--mute);background:var(--paper)}
.bar{height:14px;background:var(--paper);border:2px solid var(--line);border-radius:99px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.vis{font-size:56px;text-align:center;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:14px 8px;margin-bottom:10px;word-break:break-word;line-height:1.15}
.opts{display:grid;gap:12px;margin:14px 0}
.opt{background:var(--paper);border:3px solid var(--c);border-bottom-width:7px;border-radius:18px;padding:12px 16px;font-size:26px;font-weight:700;text-align:left;min-height:68px;display:flex;align-items:center;gap:12px}
.opt:active{transform:translateY(3px)}
.opt:disabled{cursor:default;transform:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt.dim{opacity:.55}
.opt.ok .lt{background:var(--ok)}.opt.no .lt{background:var(--no)}
.opt.ok::after,.opt.no::after{margin-left:auto;font-size:32px;line-height:1}
.opt.ok::after{content:"✓";color:var(--ok)}.opt.no::after{content:"✗";color:var(--no)}
.fb{border-radius:16px;padding:12px 16px;font-size:22px;font-weight:700;margin-bottom:10px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--nobg);color:var(--no)}
.note{font-size:18px;font-weight:500;color:var(--ink);background:var(--paper);border:3px dashed var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.go{display:block;width:100%;background:var(--c);color:#fff;border:0;border-bottom:7px solid rgba(0,0,0,.28);border-radius:18px;padding:12px;font-size:26px;font-weight:800;margin-top:8px}
.go.alt{background:var(--paper);color:var(--ink);border:3px solid var(--line);border-bottom-width:7px}
.stars{font-size:64px;text-align:center;letter-spacing:6px;color:var(--star);margin:6px 0}
.stars .off{color:var(--line)}
.skor{text-align:center;font-size:34px;font-weight:800}
.msg{text-align:center;color:var(--mute);margin:0 0 16px}
.rev{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;font-size:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app>*{animation:in .22s ease-out}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.no{background:var(--no);border-color:var(--no)}
.dots i.cur{border-color:var(--c);box-shadow:0 0 0 3px var(--star)}
.top span.nv{display:flex;gap:8px}
.dots i.sk{border-style:dashed;border-color:var(--star)}
.form{display:flex;gap:10px;align-items:center;margin-top:18px;background:var(--paper);border:3px dashed var(--line);border-radius:16px;padding:10px 12px}
.inp{flex:1;min-width:0;font:inherit;font-size:22px;padding:8px 12px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:8px 0 2px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:16px;color:var(--mute)}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:4px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.bd{background:var(--paper);border:3px solid var(--star);border-radius:16px;padding:8px 10px;font-size:17px;text-align:center;line-height:1.15}
.bd span{display:block;font-size:34px}
.bd.off{opacity:.4;filter:grayscale(1);border-color:var(--line)}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}}
.tm{font-weight:800;color:var(--ind)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.seg button{font:inherit;font-size:18px;padding:6px 16px;min-height:48px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
summary{font-weight:700;cursor:pointer}
details div{font-size:17px;margin:4px 0}
.lt{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--paper);font-size:22px;font-weight:800;line-height:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go:not(.alt){color:#0E1530}}
:root[data-theme="dark"] .go:not(.alt){color:#0E1530}
#fb:not(:empty){position:sticky;bottom:0;z-index:2;background:var(--bg);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:6px;box-shadow:0 -14px 14px -4px var(--bg)}
body{min-height:100dvh}
@media (min-width:720px){
#app{max-width:880px;padding:36px 28px 56px}
body{font-size:24px}
h1{font-size:54px}h1 span{font-size:32px}h2{font-size:34px}
.grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.card{grid-template-columns:1fr;justify-items:center;text-align:center;row-gap:6px;padding:22px 16px}
.card .ik{grid-row:auto;font-size:72px;line-height:1}
.card b{font-size:30px}.card small{font-size:19px}
.vis{font-size:80px;padding:22px}
.opts{grid-template-columns:1fr 1fr;gap:16px}
.opt{font-size:32px;min-height:92px;padding:16px 20px}.lt{width:48px;height:48px;font-size:28px}
.fb{font-size:26px}.note{font-size:21px}
.go{font-size:30px;padding:16px;max-width:640px;margin-left:auto;margin-right:auto}
.ghost,.seg button{min-height:56px;font-size:21px}
.inp{font-size:26px}
.stars{font-size:88px}.bars{height:130px}.bars div{font-size:18px}
.badges{grid-template-columns:repeat(3,1fr)}.bd{font-size:20px}
.dots i{width:20px;height:20px}
.rev{font-size:21px}
}

/* v0.15: penyempurnaan tablet */
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.card:hover,.opt:not(:disabled):hover{transform:translateY(-2px)}.go:hover{filter:brightness(1.07)}.ghost:hover,.seg button:hover{border-color:var(--mute)}}
@media (min-width:720px){
#app{padding-left:max(28px,calc(env(safe-area-inset-left,0px) + 16px));padding-right:max(28px,calc(env(safe-area-inset-right,0px) + 16px))}
.top{margin-bottom:6px}
.dots{gap:8px;margin:14px 0 18px}
.dots i.cur{box-shadow:0 0 0 4px var(--star)}
.bar{height:18px;margin:14px 0 18px}
.kel{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin:10px 0}
.kel .rev{margin:0}
.bars div{font-size:19px}
.rev,.note{line-height:1.4}
.seg{gap:12px}
.form{padding:14px 18px}
#fb:not(:empty){padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.fb{padding:16px 20px;border-radius:18px}
}
@media (min-width:1000px){
#app{max-width:1180px;padding-top:32px}
h1{font-size:60px}
.qz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);column-gap:40px;align-items:start}
.qa{position:sticky;top:16px;text-align:center}
.qa h2{font-size:42px;margin:14px 0 16px}
.qa .vis{font-size:112px;padding:34px 20px;border-radius:26px}
.qa .ghost{min-height:64px;font-size:23px;padding:8px 26px;margin:4px 6px}
.qb .opts{grid-template-columns:1fr;gap:18px;margin-top:0}
.qb .opt{font-size:36px;min-height:104px;padding:18px 26px;border-radius:22px}
.qb .lt{width:56px;height:56px;font-size:32px}
.qb .go{max-width:none;font-size:34px;padding:20px}
.grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.card{padding:28px 18px}.card .ik{font-size:84px}.card b{font-size:34px}.card small{font-size:21px}
.kel{grid-template-columns:repeat(3,1fr)}
.badges{grid-template-columns:repeat(5,1fr);gap:14px}
.stars{font-size:112px}
}
@media (min-width:900px) and (max-height:760px) and (orientation:landscape){
#app{padding-top:16px;padding-bottom:28px}
h1{font-size:44px;margin:2px 0}h1 span{font-size:26px}
.qa .vis{font-size:80px;padding:18px}
.qa h2{font-size:34px;margin:10px 0}
.qb .opt{min-height:82px;font-size:32px;padding:12px 22px}
.qb .lt{width:48px;height:48px;font-size:28px}
.dots{margin:8px 0 12px}
.card{padding:18px 14px}.card .ik{font-size:64px}
}

/* v0.16: tombol ? versi dan perubahan */
.qbtn{min-width:48px;padding-left:0;padding-right:0;font-weight:800;font-size:22px;margin-top:14px}
.vo{position:fixed;inset:0;z-index:50;background:rgba(10,16,40,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vb{background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:22px;width:100%;max-width:560px;max-height:85dvh;overflow:auto;padding:18px 20px;font-size:18px;line-height:1.4}
.vb h2{margin:0 0 2px}
.vb .vn{display:inline-block;background:var(--mtk);color:var(--paper);border-radius:999px;padding:2px 14px;font-weight:800;font-size:18px;margin:2px 0 10px}
.vb ul{margin:6px 0 12px;padding-left:22px}
.vb li{margin:4px 0}
.vb details{margin:6px 0 12px}
.vb .go{margin-top:10px;font-size:22px;padding:10px}
@media print{.vo{display:none!important}}

/* v0.17: layar soal muat di tablet landscape (tinggi layar pendek) */
@media (min-width:720px) and (orientation:landscape){
#app{padding-top:12px;padding-bottom:20px}
.qz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);column-gap:28px;align-items:start}
.qa{position:static;text-align:center}
.qa .vis{font-size:clamp(44px,12vh,112px);padding:clamp(8px,2.5vh,30px) 12px;margin-bottom:8px}
.qa h2{font-size:clamp(24px,4.4vh,40px);margin:8px 0 10px}
.qa .ghost{min-height:56px;font-size:20px;margin:4px 6px}
.qb .opts{grid-template-columns:1fr;gap:clamp(8px,1.8vh,16px);margin-top:0}
.qb .opt{font-size:clamp(26px,4.4vh,36px);min-height:clamp(64px,10vh,100px);padding:8px 22px}
.qb .lt{width:clamp(40px,6vh,56px);height:clamp(40px,6vh,56px);font-size:clamp(22px,3.6vh,32px)}
}

/* v0.18: tampilan home dan pilih bab di tablet */
@media (min-width:720px){
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));align-items:stretch}
.card{min-width:0;align-content:center;justify-items:center}
.card b{font-size:clamp(24px,2.4vw,34px);overflow-wrap:anywhere;hyphens:auto;line-height:1.15}
.card small{font-size:clamp(17px,1.8vw,21px)}
}
@media (min-width:720px) and (orientation:landscape){
.card .ik{font-size:clamp(44px,9vh,84px)}
.card{padding:clamp(12px,2.6vh,28px) 14px}
h1{font-size:clamp(34px,6.5vh,60px)}h1 span{font-size:clamp(22px,4vh,32px)}
.sub{margin-bottom:clamp(8px,2vh,18px)}
}

/* v0.19: halaman home tablet */
.foot{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:18px}
.foot .ghost,.foot .qbtn{margin:0}
@media (min-width:720px){
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:10px}
.acts .go{max-width:none;margin:0;width:100%}
.foot{margin-top:24px}
}
@media (min-width:720px) and (orientation:landscape){
.acts{margin-top:clamp(4px,1.5vh,14px)}
.acts .go{font-size:clamp(22px,3.8vh,32px);padding:clamp(10px,2.2vh,18px)}
.foot{margin-top:clamp(10px,2.5vh,24px)}
}

/* v0.20: layar isi nama anak */
.form .add{flex:none;background:var(--mtk);color:#fff;border-color:var(--mtk);font-weight:800}
:root[data-theme="dark"] .form .add{color:#0E1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .form .add{color:#0E1530}}
@media (min-width:720px){
.form{gap:16px;padding:16px 20px;margin-top:clamp(14px,3vh,28px)}
.form .inp{font-size:30px;min-height:72px;padding:12px 20px;border-radius:18px}
.form .add{min-height:72px;font-size:26px;padding:8px 34px}
}

/* v0.21: tombol ? di pojok kanan atas */
.qbtn{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));margin:0!important;z-index:5;width:48px;height:48px;min-height:48px;padding:0;display:flex;align-items:center;justify-content:center}
#app h1{padding-right:64px}
@media (min-width:720px){.qbtn{top:max(16px,env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));width:56px;height:56px;min-height:56px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(92vw,560px);background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:16px;font-size:18px;z-index:50;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}.toast button{min-height:44px;padding:0 14px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer}
.qa .vis.bc,.vis.bc{font-size:clamp(24px,4.2vw,36px);text-align:left;line-height:1.5;padding:16px 18px;font-weight:700}
.tgt{text-align:center;font-weight:700;font-size:19px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 14px;margin:0 0 14px}.stk{display:flex;flex-wrap:wrap;gap:8px;font-size:40px;margin:6px 0 14px}.stk small{font-size:17px;color:var(--mute)}
.fm label{display:block;font-weight:700;margin:12px 0 4px;font-size:18px}
.fm .inp{width:100%;box-sizing:border-box;display:block}
.fm textarea.inp{resize:vertical}
.qa .ghost.fgb{font-size:16px;min-height:44px;padding:4px 14px}
.opt.sel{border-color:var(--ink);background:var(--paper);box-shadow:0 0 0 4px var(--star)}
.opt.sel .lt{background:var(--ink);color:var(--bg)}
.dots i.ans{background:var(--mute);border-color:var(--mute)}
.fb.ok{color:var(--okt)}.fb.no{color:var(--not)}
:root{--okt:#0B6B42;--not:#9A4300}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--okt:#4BD39A;--not:#FFB27A}:root:not([data-theme="light"]) .go:not(.alt),:root:not([data-theme="light"]) .form .add{color:var(--bg)}}
:root[data-theme="dark"]{--okt:#4BD39A;--not:#FFB27A}
:root[data-theme="dark"] .go:not(.alt),:root[data-theme="dark"] .form .add{color:var(--bg)}
@font-face{font-family:"Baloo 2 Lokal";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/baloo2-400.woff) format("woff")}
@font-face{font-family:"Baloo 2 Lokal";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/baloo2-500.woff) format("woff")}
@font-face{font-family:"Baloo 2 Lokal";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baloo2-700.woff) format("woff")}
@font-face{font-family:"Baloo 2 Lokal";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo2-800.woff) format("woff")}

/* v0.39: teman belajar (karakter anak SD) */
.kar{display:block;flex:none;max-width:100%;height:auto}
.hero{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.hero .t{min-width:0;flex:1}
.hero h1{margin-top:0}
.maskot{flex:none;background:none;border:0;padding:0;border-radius:24px;line-height:0}
.maskot .kar{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.deret{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 8px;margin:0 0 14px}
.tk{text-align:center;font-weight:700;font-size:16px;color:var(--mute)}
.tk .kar{margin:0 auto}
.hs{display:flex;justify-content:center;margin:0 0 4px}
.fb.has{display:flex;align-items:center;gap:10px}
.fb.has .kar{margin:-6px 0 -8px}
@media (min-width:720px){.maskot .kar{width:130px;height:auto}.tk .kar{width:100px;height:auto}.fb.has .kar{width:76px;height:auto}.hs .kar{width:170px;height:auto}}
.qk{display:flex;justify-content:center;margin:0 0 6px}
@media (min-width:720px){.qk .kar{width:110px;height:auto}}
@media (min-width:720px) and (orientation:landscape){.qk .kar{width:clamp(56px,11vh,100px);height:auto}}
.gb{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:2px dashed var(--line)}
